[package]
name = "firewallx-driver"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"

[lib]
name = "firewallx_driver"
crate-type = ["staticlib"]
test = false
doctest = false

[features]
native-wdk = ["dep:bindgen"]
baseline-x64 = []

[dependencies]
firewallx-protocol = { path = "../protocol" }
firewallx-policy = { path = "../policy" }
likely_stable.workspace = true

[build-dependencies]
windows-sys.workspace = true
bindgen = { version = "0.73.2", optional = true }
wdk-build = "0.6.0"
