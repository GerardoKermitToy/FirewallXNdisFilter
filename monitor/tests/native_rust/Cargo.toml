[package]
name = "firewallx-native-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "GPL-3.0-only"
build = "../../../driver/build.rs"

[lib]
path = "lib.rs"
doctest = false

[features]
default = ["native-wdk"]
native-wdk = []

[dependencies]
firewallx-protocol = { path = "../../../protocol" }
likely_stable.workspace = true

[build-dependencies]
windows-sys.workspace = true
bindgen = "0.73.2"
wdk-build = "0.6.0"
