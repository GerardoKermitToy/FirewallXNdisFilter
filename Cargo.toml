[workspace]
resolver = "2"
members = ["protocol", "policy", "driver", "monitor/tests/driver_rust", "monitor/tests/native_rust"]
default-members = ["protocol", "policy"]

[workspace.dependencies]
likely_stable = { version = "0.1.3", default-features = false }
smoltcp = { version = "0.14.0", default-features = false, features = ["proto-ipv4"] }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFilteringPlatform"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
debug = "full"
strip = "none"

[profile.release.build-override]
debug = "full"

[profile.dev]
panic = "abort"
debug = "full"

[profile.dev.build-override]
debug = "full"
